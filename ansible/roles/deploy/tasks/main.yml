---
- name: Create application directory
  ansible.builtin.file:
    path: /opt/crossposting
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Upload Docker Compose configuration
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../compose.yaml"
    dest: /opt/crossposting/compose.yaml
    owner: root
    group: root
    mode: '0640'

- name: Deploy database credentials
  ansible.builtin.copy:
    content: "POSTGRES_PASSWORD={{ vault_postgres_password }}\n"
    dest: /opt/crossposting/.env
    owner: root
    group: root
    mode: '0600'
  no_log: true

- name: Start application with Docker Compose
  community.docker.docker_compose_v2:
    project_src: /opt/crossposting
    state: present
    pull: missing
    wait: true
    wait_timeout: 120
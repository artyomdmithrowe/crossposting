---
- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Allow SSH connections
  community.general.ufw:
    rule: allow
    port: '22'
    proto: tcp

- name: Deny incoming connections by default
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Allow outgoing connections by default
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Enable UFW
  community.general.ufw:
    state: enabled
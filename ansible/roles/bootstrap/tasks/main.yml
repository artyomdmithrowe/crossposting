---
- name: Create administrator user
  ansible.builtin.user:
    name: artyom
    state: present
    shell: /bin/bash
    groups:
      - sudo
    append: true
    create_home: true

- name: Add administrator SSH key
  ansible.posix.authorized_key:
    user: artyom
    key: "{{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'HOME') ~ '/.ssh/crossposting_ed25519.pub') }}"
    state: present

- name: Ensure hostname is resolvable locally
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1(\s|$)'
    line: "127.0.1.1 {{ ansible_hostname }}"
    state: present
    backup: true
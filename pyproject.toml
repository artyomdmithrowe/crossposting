[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crossposting"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
    "SQLAlchemy>=2.0,<2.1",
    "alembic>=1.16,<2.0",
    "psycopg[binary]>=3.2,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
include = ["app*"]

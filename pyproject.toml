[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crossposting"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
    "SQLAlchemy>=2.0,<2.1",
    "alembic>=1.16,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "aiogram>=3.31,<4.0",
    "python-dotenv>=1.0,<2.0",
    "aiohttp-socks>=0.10,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.14,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
]